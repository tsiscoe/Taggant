[package]
name = "taggant"
version = "0.1.0"
edition = "2024"
authors = ["tsiscoe <tsiscoe@users.noreply.github.com>"]
description = "Taggant: Asymmetric Elligator2 Cryptographic Honeytoken Seeder, Stateless Leak Autopsy Engine & Loopback Tripwire (Pure Rust 2024)"
license = "MIT"
repository = "https://github.com/tsiscoe/Taggant"
readme = "README.md"
keywords = ["cryptography", "honeytoken", "elligator2", "security", "canary"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[[bin]]
name = "taggant"
path = "src/main.rs"

[lib]
name = "taggant"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography (X25519 + Custom Elligator2 + Argon2id + HKDF-SHA256 + BLAKE3 + XChaCha20-Poly1305 + Zeroize)
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.13"
sha2 = "0.10"
blake3 = "1.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
base64 = "0.22"

# Storage (SQLite WAL mode bundled >= 3.51.2)
rusqlite = { version = "0.42.0", features = ["bundled"] }

# Pattern Extraction & Async Loopback Tripwire
regex = "1.11"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

# TUI (Ratatui v0.30+ & Crossterm)
ratatui = "0.30"
crossterm = "0.28"

# OS Keyring
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
rpassword = "7.3"

[dev-dependencies]
tempfile = "3.14"
proptest = "1.5"

[lints.rust]
unsafe_code = "forbid"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.x25519-dalek]
opt-level = 3
